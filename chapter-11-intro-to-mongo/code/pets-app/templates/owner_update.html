<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Owner - {{ data.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/list">Pets App</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/list">Pets</a>
            <a class="nav-link active" href="/owners">Owners</a>
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width: 580px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white fw-semibold">
            Edit Owner Details
        </div>
        <div class="card-body p-4">
            <form action="/owner/update/{{ data.id }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Owner Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ data.name }}" required>
                </div>

                <div class="mb-3">
                    <label for="city" class="form-label fw-bold">City</label>
                    <input type="text" class="form-control" id="city" name="city" value="{{ data.city if data.city else '' }}">
                </div>

                <div class="mb-4">
                    <label for="type_of_home" class="form-label fw-bold">Type of Home</label>
                    <input type="text" class="form-control" id="type_of_home" name="type_of_home" value="{{ data.type_of_home if data.type_of_home else '' }}" placeholder="e.g. Condo, House, Apartment">
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a href="/owners" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
