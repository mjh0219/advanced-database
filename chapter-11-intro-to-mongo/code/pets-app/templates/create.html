<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Pet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/list">Pets App</a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/list">Pets</a>
            <a class="nav-link" href="/owners">Owners</a>
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width: 540px;">
    <div class="card shadow border-0">
        <div class="card-body p-4">
            <h3 class="card-title mb-4">Add a New Pet</h3>
            <form action="/create" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Pet Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Milo" required>
                </div>
                <div class="mb-3">
                    <label for="type" class="form-label fw-bold">Type / Species <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="type" name="type" placeholder="e.g. dog, cat, rabbit" required>
                </div>
                <div class="mb-3">
                    <label for="age" class="form-label fw-bold">Age</label>
                    <input type="number" class="form-control" id="age" name="age" value="1" min="0" required>
                </div>
                <div class="mb-4">
                    <label for="owner_id" class="form-label fw-bold">Owner</label>
                    <select class="form-select" id="owner_id" name="owner_id">
                        <option value="">-- No Owner (Unassigned) --</option>
                        {% for owner in owners %}
                            <option value="{{ owner.id }}">{{ owner.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <a href="/list" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">+ Create Pet</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
